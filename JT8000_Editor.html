<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>JT-8000 layout editor</title>
<style>
/* ===========================================================================
   JT-8000 LAYOUT EDITOR

   The layout stopped being code and became data; this edits that data. Nothing
   here re-derives anything - a block sits exactly where it is put and stays
   there until it is moved again. That is the whole point: rules that resolve
   constraints on your behalf are what kept moving things you were happy with.

   Two levels. BLOCK mode moves and resizes the section boxes. Double-click a
   block to go INSIDE it and place its controls and group labels. Escape leaves.
   =========================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d11;color:#c9d1dc;font:13px -apple-system,Segoe UI,Roboto,sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;gap:5px;align-items:center;padding:7px 9px;background:#151922;
     border-bottom:1px solid #232a35;flex-wrap:wrap;flex:none}
button{background:#222a36;border:1px solid #333d4c;color:#c9d1dc;border-radius:4px;
       padding:5px 9px;font-size:12px;cursor:pointer}
button:hover{background:#2b3542}
button.on{background:#8b3a1f;border-color:#c8551f;color:#fff}
.sep{width:1px;height:22px;background:#2b3542;margin:0 4px}
label{font-size:11px;color:#7d8797}
#wrap{flex:1;overflow:auto;position:relative;background:#0b0d11}
#panel{position:relative;transform-origin:0 0;background:linear-gradient(180deg,#3a3f4a,#1e222a)}
.blk{position:absolute;border:1px solid #47535f;background:rgba(30,36,46,.55);border-radius:3px}
.blk.sel{border-color:#ff8a3d;box-shadow:0 0 0 2px rgba(255,138,61,.3);z-index:5}
.blk.layer{border-style:dashed;border-color:#c8551f}
.blk.inside{border-color:#5cc8ff;background:rgba(20,40,55,.5);z-index:4}
.blk.bad{border-color:#ff5a4a;box-shadow:0 0 0 2px rgba(255,90,74,.35)}
.blk>.name{position:absolute;left:6px;top:3px;font-weight:700;letter-spacing:.06em;
           color:#e8ecf2;white-space:nowrap;pointer-events:none}
.ctl{position:absolute;border-radius:2px;pointer-events:none}
.ctl.knob{background:radial-gradient(circle at 38% 32%,#c9cdd4,#3a4049 62%,#1b1f26);border-radius:50%}
.ctl.fader{background:linear-gradient(90deg,#0d1014,#2a3039 45%,#0d1014)}
.ctl.combo{background:linear-gradient(180deg,#4a2a12,#241408);border:1px solid #7a4a1e}
.ctl.toggle{background:linear-gradient(180deg,#5a2422,#2a1211);border:1px solid #6d2b26}
.ctl.stepgrid{background:#0a0c0f;border:1px solid #3a424f}
.cell{position:absolute;border:1px dashed rgba(120,160,200,.30)}
.cell.sel{border:1px solid #ff8a3d;background:rgba(255,138,61,.14);z-index:6}
.lab{position:absolute;color:#9aa4b4;white-space:nowrap;pointer-events:none}
.glab{position:absolute;font-weight:700;color:#7fd2ff;letter-spacing:.08em;white-space:nowrap}
.glab.sel{color:#ff8a3d;background:rgba(255,138,61,.15)}
#out{flex:none;background:#0e1116;border-top:1px solid #232a35;padding:7px 9px;
     display:flex;gap:9px;align-items:flex-start}
#msg{flex:1;font-size:11px;line-height:1.5;max-height:66px;overflow:auto}
.err{color:#ff7a6a}
.ok{color:#6fbf7f}
textarea{width:360px;height:66px;background:#080a0d;color:#8fd0a0;border:1px solid #232a35;
         border-radius:3px;font:10px ui-monospace,Menlo,monospace;padding:5px}
</style>
</head>
<body>

<div id="bar">
  <button id="fit">Fit</button><button id="zin">+</button><button id="zout">&minus;</button>
  <span class="sep"></span>
  <label>Snap</label>
  <button class="snap on" data-snap="grid">Grid</button>
  <button class="snap" data-snap="edge">Edges</button>
  <button class="snap" data-snap="off">Off</button>
  <span class="sep"></span>
  <button id="al">Left</button><button id="ar">Right</button>
  <button id="at">Top</button><button id="ab">Bottom</button>
  <button id="aw">Same W</button><button id="ah">Same H</button>
  <button id="dh">Space H</button>
  <span class="sep"></span>
  <button id="view">View: MAIN</button>
  <span class="sep"></span>
  <button id="save">Download layout.json</button>
  <button id="reset">Reset</button>
  <span class="sep"></span>
  <span id="info"></span>
</div>

<div id="wrap"><div id="panel"></div></div>

<div id="out">
  <div id="msg"></div>
  <textarea id="spec" readonly></textarea>
</div>

var panel = document.getElementById('panel');
var wrap  = document.getElementById('wrap');
var scale = 0.3, snap = 'grid', inside = null, sel = [], view = 'MAIN';
var ORIG = JSON.stringify(DOC);

var VIEWS = ['MAIN','REVERB','SEQ','ARP','SETUP'];
var LAYERMAP = {REVERB:'Reverb', SEQ:'Step Sequencer', ARP:'Arpeggiator', SETUP:'Setup'};

function blockByName(n){
  for (var i=0;i<DOC.blocks.length;i++) if (DOC.blocks[i].name===n) return DOC.blocks[i];
  return null;
}
function visible(b){ return b.layer ? LAYERMAP[view] === b.name : true; }

/* Blocks sharing the layer area that are not themselves layers - the Main
   layer's content. A layer is meant to cover these, so overlap is not an error
   between them. */
function mainLayerBlocks(){
  var lay = DOC.blocks.filter(function(b){return b.layer;});
  if (!lay.length) return [];
  var top = Math.min.apply(null, lay.map(function(b){return b.y;}));
  return DOC.blocks.filter(function(b){return !b.layer && b.y >= top - 4;});
}

/* --- snapping -------------------------------------------------------------
   Grid keeps the column rhythm, which is what makes vertical divides line up.
   Edges snaps to any other block's edge, for when a row should agree with the
   one above. Off is off - sometimes by eye is right. */
function edges(axis, skip){
  var out = [];
  DOC.blocks.forEach(function(b){
    if (skip.indexOf(b) >= 0 || !visible(b)) return;
    if (axis === 'x') out.push(b.x, b.x + b.w); else out.push(b.y, b.y + b.h);
  });
  return out;
}
function snapVal(v, others, axis){
  if (snap === 'off') return Math.round(v);
  if (snap === 'grid'){
    var step = axis === 'x' ? DOC.grid.colw : DOC.grid.row;
    var base = axis === 'x' ? DOC.canvas.margin : 0;
    return Math.round(base + Math.round((v - base) / step) * step);
  }
  var best = v, bd = 14;
  others.forEach(function(e){ if (Math.abs(e-v) < bd){ bd = Math.abs(e-v); best = e; } });
  return Math.round(best);
}

/* --- rendering ------------------------------------------------------------- */
function render(){
  panel.style.width  = DOC.canvas.w + 'px';
  panel.style.height = DOC.canvas.h + 'px';
  panel.style.transform = 'scale(' + scale + ')';
  panel.innerHTML = '';

  DOC.blocks.forEach(function(b){
    if (!visible(b)) return;

    var el = document.createElement('div');
    el.className = 'blk'
      + (sel.indexOf(b) >= 0 && inside !== b ? ' sel' : '')
      + (b.layer ? ' layer' : '')
      + (inside === b ? ' inside' : '');
    el.style.cssText = 'left:'+b.x+'px;top:'+b.y+'px;width:'+b.w+'px;height:'+b.h+'px';
    el.dataset.block = b.name;

    var nm = document.createElement('div');
    nm.className = 'name'; nm.style.fontSize = '22px'; nm.textContent = b.name;
    el.appendChild(nm);

    b.groups.forEach(function(g, gi){
      var q = document.createElement('div');
      q.className = 'glab' + (inside === b && sel.indexOf(g) >= 0 ? ' sel' : '');
      q.style.cssText = 'left:'+g.x+'px;top:'+g.y+'px;font-size:19px';
      q.textContent = g.label; q.dataset.group = gi;
      el.appendChild(q);
    });

    b.controls.forEach(function(c, ci){
      var cy = c.y + (c.kind === 'fader' ? 0 : 34);
      var cw = c.kind === 'knob' ? 160 : (c.kind === 'fader' ? 26 : c.w);
      var cx = c.x + (c.kind === 'knob' ? Math.max(0,(c.w-160)/2) : 0);
      var g = document.createElement('div');
      g.className = 'ctl ' + c.kind;
      g.style.cssText = 'left:'+cx+'px;top:'+cy+'px;width:'+cw+'px;height:'+(c.h-34)+'px';
      el.appendChild(g);

      var l = document.createElement('div');
      l.className = 'lab';
      l.style.cssText = 'left:'+c.x+'px;top:'
        + (c.kind === 'fader' ? (c.y + c.h - 30) : c.y) + 'px;width:'+c.w
        + 'px;font-size:18px;text-align:'
        + (c.kind === 'knob' || c.kind === 'fader' ? 'center' : 'left');
      l.textContent = c.t;
      el.appendChild(l);

      if (inside === b){
        var cell = document.createElement('div');
        cell.className = 'cell' + (sel.indexOf(c) >= 0 ? ' sel' : '');
        cell.style.cssText = 'left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:'+c.h+'px';
        cell.dataset.ctl = ci;
        el.appendChild(cell);
      }
    });

    panel.appendChild(el);
  });

  check();
  document.getElementById('spec').value = DOC.blocks.map(function(b){
    return b.name + '  ' + b.x + ',' + b.y + '  ' + b.w + 'x' + b.h;
  }).join('\n');
  document.getElementById('info').textContent =
    Math.round(scale*100) + '%   ' + DOC.canvas.w + 'x' + DOC.canvas.h
    + (inside ? '   inside ' + inside.name + ' — Esc to leave' : '')
    + '   ' + sel.length + ' selected';
}

/* --- validation: reported, never corrected --------------------------------- */
function check(){
  var msgs = [], shown = DOC.blocks.filter(visible), mains = mainLayerBlocks();

  shown.forEach(function(b){
    if (b.x < 0 || b.y < 0 || b.x+b.w > DOC.canvas.w || b.y+b.h > DOC.canvas.h)
      msgs.push(b.name + ' is off the canvas');
    b.controls.forEach(function(c){
      if (c.x < 0 || c.y < 0 || c.x+c.w > b.w || c.y+c.h > b.h)
        msgs.push(b.name + ': ' + c.t + ' is outside its block');
    });
  });

  for (var i=0;i<shown.length;i++){
    for (var j=i+1;j<shown.length;j++){
      var a = shown[i], b2 = shown[j];
      if (a.layer && mains.indexOf(b2) >= 0) continue;
      if (b2.layer && mains.indexOf(a) >= 0) continue;
      if (a.x < b2.x+b2.w && b2.x < a.x+a.w && a.y < b2.y+b2.h && b2.y < a.y+a.h)
        msgs.push(a.name + ' overlaps ' + b2.name);
    }
  }

  document.getElementById('msg').innerHTML = msgs.length
    ? '<span class="err">' + msgs.slice(0,6).join('<br>') + '</span>'
    : '<span class="ok">no overlaps; everything inside its block and the canvas</span>';

  shown.forEach(function(b){
    var node = panel.querySelector('[data-block="' + CSS.escape(b.name) + '"]');
    if (node) node.classList.toggle('bad',
      msgs.some(function(m){ return m.indexOf(b.name) === 0; }));
  });
}

/* --- pointer --------------------------------------------------------------- */
var drag = null;

panel.addEventListener('pointerdown', function(e){
  var blkEl = e.target.closest('.blk');
  if (!blkEl){ sel = []; render(); return; }
  var b = blockByName(blkEl.dataset.block);
  var cellEl = e.target.closest('.cell'), glabEl = e.target.closest('.glab');

  var item = b;
  if (inside === b && cellEl) item = b.controls[+cellEl.dataset.ctl];
  else if (inside === b && glabEl) item = b.groups[+glabEl.dataset.group];

  if (e.shiftKey){
    var k = sel.indexOf(item);
    if (k >= 0) sel.splice(k,1); else sel.push(item);
  } else if (sel.indexOf(item) < 0){
    sel = [item];
  }

  var mode = 'move';
  if (item === b && inside !== b){
    var r = blkEl.getBoundingClientRect();
    if (r.right - e.clientX < 16) mode = 'w';
    else if (r.bottom - e.clientY < 16) mode = 'h';
  }

  drag = { mode: mode, sx: e.clientX, sy: e.clientY,
           start: sel.map(function(it){
             return { it: it, x: it.x, y: it.y, w: it.w||0, h: it.h||0 }; }) };
  panel.setPointerCapture(e.pointerId);
  render();
  e.preventDefault();
});

panel.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = (e.clientX - drag.sx)/scale, dy = (e.clientY - drag.sy)/scale;
  var skip = drag.start.map(function(s){ return s.it; });

  drag.start.forEach(function(s){
    if (drag.mode === 'move'){
      /* Inside a block, positions are relative and snapping to block edges
         would be meaningless, so controls move freely. */
      s.it.x = inside ? Math.round(s.x+dx) : snapVal(s.x+dx, edges('x',skip), 'x');
      s.it.y = inside ? Math.round(s.y+dy) : snapVal(s.y+dy, edges('y',skip), 'y');
    } else if (drag.mode === 'w'){
      s.it.w = Math.max(80, snapVal(s.x+s.w+dx, edges('x',skip),'x') - s.it.x);
    } else {
      s.it.h = Math.max(60, snapVal(s.y+s.h+dy, edges('y',skip),'y') - s.it.y);
    }
  });
  render();
  e.preventDefault();
});

panel.addEventListener('pointerup',     function(){ drag = null; });
panel.addEventListener('pointercancel', function(){ drag = null; });

panel.addEventListener('dblclick', function(e){
  var blkEl = e.target.closest('.blk');
  if (!blkEl) return;
  inside = blockByName(blkEl.dataset.block);
  sel = [];
  render();
});

window.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ inside = null; sel = []; render(); return; }
  var d = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if (!d || !sel.length) return;
  var step = e.shiftKey ? 10 : 1;
  sel.forEach(function(it){ it.x += d[0]*step; it.y += d[1]*step; });
  render();
  e.preventDefault();
});

/* --- alignment: the reason an editor beats nudging numbers ----------------- */
function align(fn){ if (sel.length > 1){ fn(sel); render(); } }
var A = function(id, fn){ document.getElementById(id).onclick = function(){ align(fn); }; };
A('al', function(s){ var v = Math.min.apply(null, s.map(function(i){return i.x;}));
                     s.forEach(function(i){ i.x = v; }); });
A('ar', function(s){ var v = Math.max.apply(null, s.map(function(i){return i.x+(i.w||0);}));
                     s.forEach(function(i){ i.x = v-(i.w||0); }); });
A('at', function(s){ var v = Math.min.apply(null, s.map(function(i){return i.y;}));
                     s.forEach(function(i){ i.y = v; }); });
A('ab', function(s){ var v = Math.max.apply(null, s.map(function(i){return i.y+(i.h||0);}));
                     s.forEach(function(i){ i.y = v-(i.h||0); }); });
A('aw', function(s){ var v = s[0].w; s.forEach(function(i){ if (i.w) i.w = v; }); });
A('ah', function(s){ var v = s[0].h; s.forEach(function(i){ if (i.h) i.h = v; }); });
A('dh', function(s){
  var a = s.slice().sort(function(p,q){ return p.x-q.x; });
  var x0 = a[0].x, x1 = a[a.length-1].x + (a[a.length-1].w||0);
  var used = a.reduce(function(t,i){ return t + (i.w||0); }, 0);
  var gap = (x1 - x0 - used) / (a.length - 1), x = x0;
  a.forEach(function(i){ i.x = Math.round(x); x += (i.w||0) + gap; });
});

/* --- toolbar --------------------------------------------------------------- */
document.querySelectorAll('.snap').forEach(function(btn){
  btn.onclick = function(){
    snap = btn.dataset.snap;
    document.querySelectorAll('.snap').forEach(function(b){
      b.classList.toggle('on', b === btn); });
  };
});
document.getElementById('zin').onclick  = function(){ scale = Math.min(1.5, scale*1.25); render(); };
document.getElementById('zout').onclick = function(){ scale = Math.max(.06, scale/1.25); render(); };
document.getElementById('fit').onclick  = function(){
  scale = Math.min((wrap.clientWidth-20)/DOC.canvas.w,
                   (wrap.clientHeight-20)/DOC.canvas.h);
  render();
};
document.getElementById('view').onclick = function(){
  view = VIEWS[(VIEWS.indexOf(view)+1) % VIEWS.length];
  this.textContent = 'View: ' + view;
  inside = null; sel = []; render();
};
document.getElementById('save').onclick = function(){
  var blob = new Blob([JSON.stringify(DOC, null, 1)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'layout.json'; a.click();
};
document.getElementById('reset').onclick = function(){
  if (!confirm('Discard every change and reload the layout as generated?')) return;
  DOC = JSON.parse(ORIG); inside = null; sel = []; render();
};

document.getElementById('fit').click();
</script>
