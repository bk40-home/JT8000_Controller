  - id: 0x088A            # section 17, index 10
    key: arp.step_onoff
    v1_cc: 235
    juce_id: arp_step_onoff   # new: no APVTS parameter existed
    name: "Arp Step On/Off"
    label: "GATE"
    # Per-step rest/trigger for the step at arp.step_select.  Default ON so a
