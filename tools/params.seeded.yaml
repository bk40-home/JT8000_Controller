  - id: 0x088C            # section 17, index 12
    key: arp.step_ratchet
    v1_cc: 237
    juce_id: arp_step_ratchet   # new: no APVTS parameter existed
    name: "Arp Step Ratchet"
    label: "RATCH"
    # Per-step ratchet count 1..4 for the step at arp.step_select.  1 = single
    # hit; N = N rapid re-triggers dividing the step's gate portion.
    type: int
    scope: patch
    range: {min: 1, max: 4, curve: lin}
    unit: ""
    default: 1
    smooth_ms: 0
    ui: {section: 17, group: 2}
  # NOTE: the arp deliberately has NO clock-source param of its own.  It follows
  # the GLOBAL clock source (clock.clock_source) — a single shared TempoClock
  # drives LFOs, seq and arp together.  An earlier mirror param here was removed:
  # two params writing one piece of state fought each other at snapshot-drain
  # time (the mirror's Internal default overwrote an External selection every
  # block).  Select External once via clock.clock_source and the arp follows.
