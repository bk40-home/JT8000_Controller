  # ---------------------------------------------------------------------------
  # [17] Arpeggiator (NEW in v2)
  # ---------------------------------------------------------------------------
  # Section base 0x0880 == (17 << 7).  Independent of the step sequencer: its
  # own division/phase, but it reads the SHARED TempoClock BPM (so internal-
  # tempo and external-MIDI-clock changes move the arp, LFOs and seq together).
  #
  # Playback model (docs/PHASE9_ARP_SPEC.md):
  #   * When arp.enable is ON, played notes are CONSUMED — they feed the arp's
  #     held-note list and only the arp sounds (classic hardware behaviour).
  #   * 7 note-ordering modes x 1..4 octaves.
  #   * A 16-step pattern layer: per step on/off + accent(0..127) + ratchet(1..4).
  #     Ratchet subdivides the GATE portion of the step, so gate-length still
  #     shapes staccato within each ratchet sub-hit.
  #   * Rate uses the shared 12-entry timing_mode set.  arp.free_hz is the
  #     fallback rate while rate==Free (mode 0), mirroring the LFO freeHz idiom.
  #   * arp.latch holds the pattern running after keys are released.
  #   * Start (MIDI 0xFA) resets phase to step 0; BPM follows the clock.
  #
  # DEFAULT PATCH INVARIANCE: arp.enable defaults OFF, so drainNoteEvents keeps
  # its current path and the render baseline is byte-identical.
  - id: 0x0880            # section 17, index 0
    key: arp.enable
    v1_cc: 225
    juce_id: arp_enable   # new: no APVTS parameter existed
    name: "Arp Enable"
    label: "ON"
    type: toggle
    scope: patch
    default: false
    smooth_ms: 0
    ui: {section: 17, group: 0}
  - id: 0x0881            # section 17, index 1
    key: arp.mode
    v1_cc: 226
    juce_id: arp_mode   # new: no APVTS parameter existed
    name: "Arp Mode"
    label: "MODE"
    type: select
    scope: patch
    options: arp_mode
    default: 0
    smooth_ms: 0
    ui: {section: 17, group: 0}
  - id: 0x0882            # section 17, index 2
    key: arp.octaves
    v1_cc: 227
    juce_id: arp_octaves   # new: no APVTS parameter existed
    name: "Arp Octaves"
    label: "OCT"
    type: select
    scope: patch
    options: arp_octaves
    default: 0            # option 0 == "1" octave
    smooth_ms: 0
    ui: {section: 17, group: 0}
  - id: 0x0883            # section 17, index 3
    key: arp.latch
    v1_cc: 228
    juce_id: arp_latch   # new: no APVTS parameter existed
    name: "Arp Latch"
    label: "LATCH"
    type: toggle
    scope: patch
    default: false
    smooth_ms: 0
    ui: {section: 17, group: 0}
  - id: 0x0884            # section 17, index 4
    key: arp.rate
    v1_cc: 229
    juce_id: arp_rate   # new: no APVTS parameter existed
    name: "Arp Rate"
    label: "RATE"
    # Shared 12-entry musical-division set.  Option 0 (Free) falls back to
    # arp.free_hz.  Default 1/16 is the trance staple.
    type: select
    scope: patch
    options: timing_mode
    default: 7            # timing_mode index 7 == "1/16"
    smooth_ms: 0
    ui: {section: 17, group: 1}
  - id: 0x0885            # section 17, index 5
    key: arp.free_hz
    v1_cc: 230
    juce_id: arp_free_hz   # new: no APVTS parameter existed
    name: "Arp Free Rate"
    label: "FREE"
    # Fallback rate (Hz) used only while arp.rate == Free.  Exp-mapped in the
    # engine (0.1..20 Hz), same law the step sequencer's SEQ_RATE uses.
    type: continuous
    scope: patch
    range: {min: 0, max: 1, curve: lin}
    unit: "norm"
    default: 0.5
    smooth_ms: 0
    ui: {section: 17, group: 1}
  - id: 0x0886            # section 17, index 6
    key: arp.gate_length
    v1_cc: 231
    juce_id: arp_gate_length   # new: no APVTS parameter existed
    name: "Arp Gate"
    label: "GATE"
    type: continuous
    scope: patch
    range: {min: 0, max: 1, curve: lin}
    unit: "norm"
    default: 0.5
    smooth_ms: 0
    ui: {section: 17, group: 1}
  - id: 0x0887            # section 17, index 7
    key: arp.swing
    v1_cc: 232
    juce_id: arp_swing   # new: no APVTS parameter existed
    name: "Arp Swing"
    label: "SWING"
    # 0.5 = straight; >0.5 delays even steps (shuffle).  Engine maps norm to a
