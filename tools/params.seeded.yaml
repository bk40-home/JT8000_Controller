# =============================================================================
# params.yaml — JT-8000 v2 SINGLE SOURCE OF TRUTH for all parameters
# =============================================================================
#
# Seeded mechanically from v1 ParamDefs.h by tools/seed_from_v1.py.
# From this point on, THIS FILE is authoritative.  Firmware, ESP32
# controller and JUCE editor tables are GENERATED from it by
# tools/gen_params.py — never hand-edit the generated files.
#
# RULES (design brief v1.0 §4.2):
#   * ParamIDs are PERMANENT.  id = (section << 7) | index, 14-bit.
#     NRPN number == ParamID (MSB = section, LSB = index).
#     Never renumber.  Deleting a param: move its id to retired_ids.
#   * New params append at the END of their section (next free index).
#   * 'cc' bindings come only from the curated performance set (§5.1).
#   * range.curve: lin | log | seg2   (log needs min > 0;
#     seg2 is two linear segments meeting at 'mid' when the control
#     is at its physical centre — used for v1's envelope slopes).
#   * unit 'norm' means the engine owns final scaling (v1 parity is
#     confirmed per-param during the Phase 2 DSP port).
#   * smooth_ms is the audio-plane slew class: 0 = step, 5 = fast, 20 = slow.

schema_version: 1

retired_ids: []          # ParamIDs may enter this list; they never leave

# -----------------------------------------------------------------------------
# Option sets — canonical display strings for select parameters.
# Adding an option APPENDS (indices are stored in patches).
# -----------------------------------------------------------------------------
option_sets:
  osc_wave: ["SIN", "SAW", "SQR", "TRI", "ARB", "PLS", "rSAW", "S&H", "vTRI", "BLS", "rBLS", "BLSQ", "BLP", "SSAW"]
  pitch_offset: ["-24", "-12", "0", "+12", "+24"]
  filter_engine: ["OBXa", "VA"]
  filter_mode: ["4-Pole", "2-Pole", "2P BP", "2P Push", "Xpander", "Xpander M"]
  v_a_filter: ["SVF LP2", "SVF HP2", "SVF BP2", "SVF NOTCH", "SVF AP", "Moog LP4", "Moog LP2", "Moog BP2", "Diode LP4", "Korg35 LP", "Korg35 HP", "TPT1 LP", "TPT1 HP", "MoogDV LP4", "MoogDV LP2", "MoogDV HP4", "MoogDV BP"]
  saturation: ["OFF", "SOFT", "WARM"]
  # OB-Xa Xpander pole-mix modes. Names are VERBATIM from the firmware's
  # kObxaPoleMix[15][5] table — each row mixes the five ladder taps into one
  # classic Xpander response. The bare "0".."14" these replace were a seed
  # placeholder, exactly like the FX effect names were.
  xpander_mode: ["LP4", "LP3", "LP2", "LP1", "HP3", "HP2", "HP1", "BP4", "BP2",
                 "N2", "PH3", "HP2+LP1", "HP3+LP1", "N2+LP1", "PH3+LP1"]
  l_f_o_wave: ["SIN", "TRI", "SAW", "SQR", "S&H", "NOISE"]
  # JP-8000 "LFO1 & ENV Destination" (patch offset 0x18): routes the SUM of
  # LFO1-pitch and the pitch envelope to both oscs, OSC2 alone, or into the
  # cross-mod depth.  LFO2-pitch is NOT routed (manual p.112/118): it always
  # hits both oscs.
  pitch_mod_dest: ["OSC1+2", "OSC2", "X-MOD"]
  l_f_o_dest: ["None", "Pitch", "Filter", "PWM", "Amp"]
  timing_mode: ["Free", "4 Bars", "2 Bars", "1 Bar", "1/2", "1/4", "1/8", "1/16", "1/32", "1/4T", "1/8T", "1/16T"]
  poly_mode: ["Poly", "Mono", "Unison"]
  # Canonical FX names — these come from the firmware FX design, not from v1 CC
  # buckets. The numeric placeholders they replace were a seed artefact.
  f_x_mod_effect: ["OFF", "Chorus 1", "Chorus 2", "Chorus 3", "Flanger 1", "Flanger 2",
                   "Flanger 3", "Phaser 1", "Phaser 2", "Phaser 3", "Phaser 4",
                   "Super Chorus"]
  f_x_delay_effect: ["OFF", "Mono Short", "Mono Long", "Pan L>R", "Pan R>L", "Pan Stereo"]
  drive: ["OFF", "Soft", "Hard"]
  seq_dir: ["Fwd", "Rev", "Bounce", "Random"]
  seq_dest: ["None", "Pitch", "Filter", "PWM", "Amp"]
  # Aux lane runs parallel to the gate lane on the SAME clock (shared position/
  # rate/direction/gate).  Its destinations are the CamelSpace set.  Stage B
  # wires None + Filter only; Pan/DelaySend/Drive are INERT placeholders (the
  # option exists, selecting it routes nowhere) until Stages C/D land them.
  seq_aux_dest: ["None", "Filter", "Pan", "DelaySend", "Drive"]
  perf_mode: ["Single", "Layer", "Split"]
  edit_target: ["A", "B", "Both"]
  clock_source: ["Internal", "Ext MIDI"]
  # Voice allocation across layers A+B (always sums to 8).
  voice_split: ["1+7", "2+6", "3+5", "4+4", "5+3", "6+2", "7+1"]
  # Arpeggiator note-ordering modes (section 17).  Order is FROZEN with
  # ArpMode in Arpeggiator.h — stored in patches, never reorder.
  #   Up/Down INC repeats the top & bottom notes; Up/Down EXC does not.
  #   AsPlayed follows key-press order; Chord fires all held notes per step.
  arp_mode: ["Up", "Down", "UpDn Inc", "UpDn Exc", "AsPlayed", "Random", "Chord"]
  # Arp octave span: how many octaves the pattern repeats up through.
  arp_octaves: ["1", "2", "3", "4"]
  midi_channel: ["Ch 1", "Ch 2", "Ch 3", "Ch 4", "Ch 5", "Ch 6", "Ch 7", "Ch 8",
                 "Ch 9", "Ch 10", "Ch 11", "Ch 12", "Ch 13", "Ch 14", "Ch 15", "Ch 16"]
  # Which layer the front panel edits. NOT an audio crossfade — it is a
  # selector, so it carries no slew (the v1 seed gave it smooth_ms: 5).
  layer_balance: ["A", "AB", "B"]

# -----------------------------------------------------------------------------
# Sections — index IS the NRPN MSB.  Order is frozen (from v1).
# Section 16 MASTER is new in v2 (holds the CC-7 master volume).
# -----------------------------------------------------------------------------
sections:
  - {index: 0, name: "Oscillator 1", groups: ["Wave & Tuning", "Supersaw", "Feedback", "DC & Ring", "Arbitrary"]}
  - {index: 1, name: "Oscillator 2", groups: ["Wave & Tuning", "Supersaw", "Feedback", "DC & Ring", "Arbitrary"]}
  - {index: 2, name: "Mixer", groups: ["Levels", "Cross Mod & Sync"]}
  - {index: 3, name: "Filter", groups: ["Core", "Engine", "Multimode", "Xpander"]}
  - {index: 4, name: "Amp Envelope", groups: ["Main"]}
  - {index: 5, name: "Filter Envelope", groups: ["Main"]}
  - {index: 6, name: "Pitch Envelope", groups: ["Main"]}
  - {index: 7, name: "LFO 1", groups: ["Core", "Per-Destination", "Routing"]}
  - {index: 8, name: "LFO 2", groups: ["Core", "Per-Destination", "Routing"]}
  - {index: 9, name: "Effects", groups: ["EQ & Drive", "Modulation", "Delay", "Output"]}
  - {index: 10, name: "Velocity", groups: ["Sensitivity"]}
  - {index: 11, name: "Performance", groups: ["Glide", "Voice", "Bend & Level"]}
  - {index: 12, name: "BPM Clock", groups: ["Clock"]}
  - {index: 13, name: "Step Sequencer", groups: ["Control", "Routing", "Timing", "Steps", "Aux Lane"]}
  - {index: 14, name: "Voice Mode", groups: ["Layer Mode", "Voice Split"]}
  - {index: 15, name: "Global Reverb", groups: ["Tank", "Extended"]}
  - {index: 16, name: "Master", groups: ["Output"]}
  - {index: 17, name: "Arpeggiator", groups: ["Control", "Timing", "Steps"]}

